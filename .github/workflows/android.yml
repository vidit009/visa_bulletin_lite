name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --platforms=android,ios --org com.visabulletin .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build apk --release --dart-define=BULLETIN_URL=${{ vars.BULLETIN_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: visa-bulletin-lite-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
