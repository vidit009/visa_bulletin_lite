name: Build iOS unsigned
on: { workflow_dispatch: {} }
jobs:
  build:
    runs-on: macos-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter create --platforms=android,ios --org com.visabulletin .
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter build ios --release --no-codesign --dart-define=BULLETIN_URL=${{ vars.BULLETIN_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: visa-bulletin-lite-ios-unsigned
          path: app/build/ios/iphoneos/Runner.app
