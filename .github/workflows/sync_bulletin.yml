name: Sync Visa Bulletin Data

on:
  schedule:
    # Runs every 2 hours at minute 15 (e.g. 01:15, 03:15, 05:15... UTC)
    # Using an offset minute avoids top-of-hour GitHub queue congestion
    - cron: '15 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bulletin Scraper
        run: |
          python backend/scrape_bulletin.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current.json
          if git diff --staged --quiet; then
            echo "No changes in Visa Bulletin data."
          else
            git commit -m "Auto-sync: update Visa Bulletin data from USCIS & State.gov [skip ci]"
            git push
          fi
