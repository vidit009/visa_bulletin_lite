name: Sync Visa Bulletin Data

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk python3-dev libxkbcommon-x11-0

      - name: Install Python Dependencies
        run: |
          pip install seleniumbase pyautogui beautifulsoup4
          sbase install chromedriver

      - name: Run Bulletin Scraper
        run: |
          xvfb-run --server-args="-screen 0 1920x1080x24" python backend/scrape_bulletin.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current.json
          if git diff --staged --quiet; then
            echo "No changes in Visa Bulletin data."
          else
            git commit -m "Auto-sync: update Visa Bulletin data from State.gov [skip ci]"
            git push
          fi
