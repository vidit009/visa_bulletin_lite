name: Sync Visa Bulletin Data

on:
  schedule:
    # 1. Government business hours (Mon-Fri 9:15 AM - 6:45 PM EDT / 13:15 - 22:45 UTC):
    # Runs every 30 minutes (at :15 and :45 past the hour) to catch releases within minutes
    - cron: '15,45 13-22 * * 1-5'

    # 2. Weekday off-peak & nights (every 2 hours):
    - cron: '15 1,3,5,7,9,11,23 * * 1-5'

    # 3. Weekends (Saturday & Sunday - every 2 hours):
    - cron: '15 */2 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bulletin Scraper
        run: |
          python backend/scrape_bulletin.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/current.json
          if git diff --staged --quiet; then
            echo "No changes in Visa Bulletin data."
          else
            git commit -m "Auto-sync: update Visa Bulletin data from USCIS & State.gov [skip ci]"
            git push
          fi
